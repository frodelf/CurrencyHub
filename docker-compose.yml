services:
  app:
    build: .
    container_name: currencyhub-app
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OXR_API_KEY: ${OXR_API_KEY:-}
      OXR_ENABLED: ${OXR_ENABLED:-false}
    ports:
      - "8081:8081"
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`currencyhub.localhost`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=8081"
    networks:
      - currencyhub-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: currencyhub-redis
    command: redis-server --requirepass redissecret
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redissecret", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - currencyhub-net
    restart: unless-stopped

  traefik:
    image: traefik:v3.0
    container_name: currencyhub-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - currencyhub-net
    restart: unless-stopped

volumes:
  redis-data:

networks:
  currencyhub-net:
    driver: bridge